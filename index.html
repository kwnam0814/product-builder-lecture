<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 추첨기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="theme-toggle" class="theme-toggle-btn">Toggle Theme</button>
        <h1>오늘 저녁 뭐 먹지?</h1>
        <div id="recommendation" class="recommendation-container">오늘 저녁 메뉴를 추천해드립니다!</div>
        <button id="generate" class="generate-btn">추천 받기</button>
    </div>

    <div class="container contact-form-container">
        <h2>제휴 문의</h2>
        <form action="https://formspree.io/f/mkovgble" method="POST" id="contact-form">
            <div class="form-group">
                <label for="name">이름:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">이메일:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">메시지:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="generate-btn">문의하기</button>
        </form>
    </div>

    <div id="disqus_thread" class="container" style="margin-top: 40px; text-align: left;"></div>
